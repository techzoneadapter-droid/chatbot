name: Desktop Dev Check

on:
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-windows.yml"
  push:
    branches:
      - main
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-windows.yml"
  workflow_dispatch:

jobs:
  check-desktop:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package.json
      - name: Install dependencies
        run: npm install
      - name: Verify desktop dev build
        run: npm run verify
